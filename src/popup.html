<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Часовой пояс</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main>
    <h1>Часовой пояс сайтов</h1>
    <label for="zone-search">Поиск часового пояса</label>
    <input id="zone-search" type="search" placeholder="Например, Asia/Tokyo" autocomplete="off">
    <label for="zone-select">Часовые пояса IANA</label>
    <select id="zone-select" size="7" aria-describedby="selection-hint"></select>
    <p id="selection-hint" class="hint">Выбор сразу включает подмену.</p>
    <label class="switch" for="enabled"><input id="enabled" type="checkbox"> Подмена включена</label>
    <button id="reload" type="button">Перезагрузить вкладки</button>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="setup" class="setup" hidden></p>
    <p class="hint">На уже открытых страницах перезагрузка применит настройку с начала загрузки.</p>
  </main>
</body>
</html>
